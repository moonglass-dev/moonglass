syntax = "proto3";

package moonglass.agent.v1;

option go_package = "moonglass.dev/moonglass/internal/protocol/agentv1";

// Envelope wraps every agent ↔ control-plane message.
message Envelope {
  uint32 version = 1;
  MessageType type = 2;
  string request_id = 3;
  bytes payload = 4;
  Error error = 5;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  ENROLL_REQUEST = 1;
  ENROLL_RESPONSE = 2;
  HEARTBEAT = 3;
  HEARTBEAT_ACK = 4;
  ERROR = 5;
  DEPLOY = 6;
  SWITCH_RELEASE = 7;
  ROLLBACK = 8;
  RUN_PRE_DEPLOY = 9;
  COMMAND_RESULT = 10;
  BUILD = 11;
  STOP_APP = 15;
  REMOVE_APP = 16;
}

message Error {
  ErrorCode code = 1;
  string detail = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  INVALID = 1;
  UNAUTHORIZED = 2;
  TOO_LARGE = 3;
  UNKNOWN_TYPE = 4;
  UNAVAILABLE = 5;
}

message EnrollRequest {
  string token_id = 1;
  bytes agent_signing_public_key = 2;
  bytes agent_age_recipient = 3;
}

message EnrollResponse {
  bytes control_plane_public_key = 1;
  EnrollResult result = 2;
}

enum EnrollResult {
  ENROLL_RESULT_UNSPECIFIED = 0;
  ACCEPTED = 1;
  TOKEN_INVALID = 2;
  TOKEN_USED = 3;
}

// Heartbeat reports what the agent knows about itself and its server. disk absent
// means not measured. deploy_key is the server's public SSH deploy key, empty
// until it exists.
message Heartbeat {
  string agent_version = 1;
  DiskReport disk = 2;
  string deploy_key = 3;
}

message HeartbeatAck {}

// DiskReport is one disk sample. Each free value is at most its total; nothing
// relates the numbers to level.
message DiskReport {
  uint64 data_root_free_bytes = 1;
  uint64 data_root_total_bytes = 2;
  uint64 agent_dir_free_bytes = 3;
  uint64 agent_dir_total_bytes = 4;
  DiskLevel level = 5;
}

enum DiskLevel {
  DISK_LEVEL_UNSPECIFIED = 0;
  OK = 1;
  LOW = 2;
  CRITICAL = 3;
}

// Deploy creates a candidate release for an app. project, environment and service select agent.toml blocks; health_path is an HTTP path inside the container, not a host path.
message Deploy {
  string app_id = 1;
  string release_id = 2;
  string image = 3;
  string project = 4;
  string environment = 5;
  string service = 6;
  uint32 port = 7;
  string health_path = 8;
  repeated string domains = 9;
  bool has_pre_deploy = 10;
}

// Build builds a GitHub commit on the server and tags the image for this release.
// repository and commit are validated fields from which the agent builds the
// clone URL itself: repository is <owner>/<repo> and commit is 40 lowercase hex
// characters. Neither is a URL, a git option or a shell string.
message Build {
  string app_id = 1;
  string release_id = 2;
  string project = 3;
  string environment = 4;
  string service = 5;
  string repository = 6;
  string commit = 7;
}

// SwitchRelease promotes a ready candidate release to current.
message SwitchRelease {
  string app_id = 1;
  string release_id = 2;
}

// Rollback promotes the previous release back to current.
message Rollback {
  string app_id = 1;
}

// StopApp stops every container of an app and removes its routes, keeping its
// containers, images, releases and volumes. A delete-class command answered with
// one CommandResult. app_id is an identifier, never a host path or shell string.
message StopApp {
  string app_id = 1;
}

// RemoveApp removes a stopped app's containers, unused images and agent state.
// A delete-class command answered with one CommandResult. app_id is an
// identifier, never a host path or shell string.
message RemoveApp {
  string app_id = 1;
}

// RunPreDeploy runs the pre-deploy command of a candidate release. args is an exec argv, never a shell string.
message RunPreDeploy {
  string app_id = 1;
  string release_id = 2;
  repeated string args = 3;
  bool reversible = 4;
}

// CommandResult answers the command with the same request_id. detail is plain text for a
// person and never carries a secret.
message CommandResult {
  CommandOutcome outcome = 1;
  string detail = 2;
  AppState app = 3;
  string image_id = 4;
  string repo_digest = 5;
}

enum CommandOutcome {
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  SUCCEEDED = 1;
  FAILED = 2;
  REJECTED = 3;
}

message AppState {
  string current_release_id = 1;
  string previous_release_id = 2;
  string candidate_release_id = 3;
  ReleasePhase phase = 4;
}

enum ReleasePhase {
  RELEASE_PHASE_UNSPECIFIED = 0;
  NONE = 1;
  PENDING = 2;
  READY = 3;
}
