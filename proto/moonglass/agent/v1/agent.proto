syntax = "proto3";

package moonglass.agent.v1;

option go_package = "moonglass.dev/moonglass/internal/protocol/agentv1";

// Envelope wraps every agent ↔ control-plane message.
message Envelope {
  uint32 version = 1;
  MessageType type = 2;
  string request_id = 3;
  bytes payload = 4;
  Error error = 5;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  ENROLL_REQUEST = 1;
  ENROLL_RESPONSE = 2;
  HEARTBEAT = 3;
  HEARTBEAT_ACK = 4;
  ERROR = 5;
  DEPLOY = 6;
  SWITCH_RELEASE = 7;
  ROLLBACK = 8;
  RUN_PRE_DEPLOY = 9;
}

message Error {
  ErrorCode code = 1;
  string detail = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  INVALID = 1;
  UNAUTHORIZED = 2;
  TOO_LARGE = 3;
  UNKNOWN_TYPE = 4;
  UNAVAILABLE = 5;
}

message EnrollRequest {
  string token_id = 1;
  bytes agent_signing_public_key = 2;
  bytes agent_age_recipient = 3;
}

message EnrollResponse {
  bytes control_plane_public_key = 1;
  EnrollResult result = 2;
}

enum EnrollResult {
  ENROLL_RESULT_UNSPECIFIED = 0;
  ACCEPTED = 1;
  TOKEN_INVALID = 2;
  TOKEN_USED = 3;
}

message Heartbeat {
  string agent_version = 1;
}

message HeartbeatAck {}

// Deploy creates a candidate release for an app.
message Deploy {
  string app_id = 1;
  string release_id = 2;
  string image = 3;
}

// SwitchRelease promotes a ready candidate release to current.
message SwitchRelease {
  string app_id = 1;
  string release_id = 2;
}

// Rollback promotes the previous release back to current.
message Rollback {
  string app_id = 1;
}

// RunPreDeploy runs the pre-deploy command of a candidate release. args is an exec argv, never a shell string.
message RunPreDeploy {
  string app_id = 1;
  string release_id = 2;
  repeated string args = 3;
  bool reversible = 4;
}
