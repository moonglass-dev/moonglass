version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - godox
    - gosec
    - govet
    - ineffassign
    - nolintlint
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          # A new dependency requires an ADR in docs/adr/ and an entry here.
          allow:
            - $gostd
            - moonglass.dev/moonglass
            - google.golang.org/protobuf
            - github.com/compose-spec/compose-go/v2
            - github.com/pelletier/go-toml/v2
            - github.com/jackc/pgx/v5
            - modernc.org/sqlite
            - github.com/caddyserver/caddy/v2
            - github.com/coder/websocket
        proxy-deps:
          # Caddy is imported only by internal/proxy. cmd/ calls proxy.Run.
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
            - "**/internal/agent/**/*.go"
            - "**/internal/keys/**/*.go"
            - "**/internal/protocol/**/*.go"
            - "**/internal/policy/**/*.go"
          deny:
            - pkg: github.com/caddyserver/caddy/v2
              desc: only internal/proxy may import Caddy
        websocket-deps:
          # coder/websocket is imported only by internal/agent and internal/server.
          # cmd/ calls into those packages.
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
            - "**/internal/protocol/**/*.go"
            - "**/internal/policy/**/*.go"
            - "**/internal/keys/**/*.go"
            - "**/internal/store/**/*.go"
          deny:
            - pkg: github.com/coder/websocket
              desc: only internal/agent and internal/server may import coder/websocket
        policy-deps:
          # Restrict these modules outside internal/policy. depguard file
          # exclusions of internal/policy itself were not applied, so this
          # deny list is limited to the packages that exist today.
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
            - "**/internal/protocol/**/*.go"
          deny:
            - pkg: github.com/compose-spec/compose-go/v2
              desc: only internal/policy may import compose-go
            - pkg: github.com/pelletier/go-toml/v2
              desc: only internal/policy may import go-toml
            - pkg: github.com/jackc/pgx/v5
              desc: only internal/store may import pgx
            - pkg: modernc.org/sqlite
              desc: only internal/store may import modernc sqlite
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          pkg: ^fmt$
          msg: only cmd/ writes to the terminal
        - pattern: ^log\.Print.*$
          pkg: ^log$
          msg: only cmd/ writes to the terminal
    godox:
      keywords:
        - TODO
        - FIXME
        - XXX
        - HACK
    govet:
      enable-all: true
    nolintlint:
      require-specific: true
      require-explanation: true
  exclusions:
    rules:
      - path: ^cmd/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - gosec
      - path: _test\.go
        linters:
          - govet
        text: "fieldalignment:"
      - path: _test\.go
        linters:
          - govet
        text: "shadow:"
      - path: _test\.go
        linters:
          - errcheck
        text: "rows.Close"
      # Waiting on a done channel of errors in a locked W1-4 test.
      - path: (internal/agent/connect_test|internal/server/agent_test)\.go
        linters:
          - errcheck
        text: "Error return value is not checked"
      # gosec does not run on tests, so nolint:gosec in them is "unused".
      - path: _test\.go
        linters:
          - nolintlint
        text: "unused for linter \"gosec\""

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - internal/policy/compose_test.go
      - internal/agent/connect_test.go
  settings:
    goimports:
      local-prefixes:
        - moonglass.dev/moonglass
