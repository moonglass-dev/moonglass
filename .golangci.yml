version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - godox
    - gosec
    - govet
    - ineffassign
    - nolintlint
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          # A new dependency requires an ADR in docs/adr/ and an entry here.
          allow:
            - $gostd
            - moonglass.dev/moonglass
            - google.golang.org/protobuf
            - github.com/compose-spec/compose-go/v2
            - github.com/pelletier/go-toml/v2
        policy-deps:
          # Restrict these modules outside internal/policy. depguard file
          # exclusions of internal/policy itself were not applied, so this
          # deny list is limited to the packages that exist today.
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
            - "**/internal/protocol/**/*.go"
          deny:
            - pkg: github.com/compose-spec/compose-go/v2
              desc: only internal/policy may import compose-go
            - pkg: github.com/pelletier/go-toml/v2
              desc: only internal/policy may import go-toml
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          pkg: ^fmt$
          msg: only cmd/ writes to the terminal
        - pattern: ^log\.Print.*$
          pkg: ^log$
          msg: only cmd/ writes to the terminal
    godox:
      keywords:
        - TODO
        - FIXME
        - XXX
        - HACK
    govet:
      enable-all: true
    nolintlint:
      require-specific: true
      require-explanation: true
  exclusions:
    rules:
      - path: ^cmd/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - gosec
      - path: _test\.go
        linters:
          - govet
        text: "fieldalignment:"

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - internal/policy/compose_test.go
  settings:
    goimports:
      local-prefixes:
        - moonglass.dev/moonglass
