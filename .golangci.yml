version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - godox
    - gosec
    - govet
    - ineffassign
    - nolintlint
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          # A new dependency requires an ADR in docs/adr/ and an entry here.
          allow:
            - $gostd
            - moonglass.dev/moonglass
            - google.golang.org/protobuf
            - github.com/compose-spec/compose-go/v2
            - github.com/pelletier/go-toml/v2
            - github.com/jackc/pgx/v5
            - modernc.org/sqlite
            - github.com/caddyserver/caddy/v2
            - github.com/coder/websocket
            - github.com/danielgtaylor/huma/v2
            - filippo.io/age
        proxy-deps:
          # Caddy is imported only by internal/proxy. cmd/ calls proxy.Run.
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
            - "**/internal/agent/**/*.go"
            - "**/internal/keys/**/*.go"
            - "**/internal/protocol/**/*.go"
            - "**/internal/policy/**/*.go"
          deny:
            - pkg: github.com/caddyserver/caddy/v2
              desc: only internal/proxy may import Caddy
        websocket-deps:
          # coder/websocket is imported only by internal/agent and internal/server.
          # cmd/ calls into those packages.
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
            - "**/internal/protocol/**/*.go"
            - "**/internal/policy/**/*.go"
            - "**/internal/keys/**/*.go"
            - "**/internal/store/**/*.go"
          deny:
            - pkg: github.com/coder/websocket
              desc: only internal/agent and internal/server may import coder/websocket
        huma-deps:
          # Huma is imported only by internal/api (ADR-0013). Every file
          # outside internal/api is covered, so new packages are too.
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/api/**"
          deny:
            - pkg: github.com/danielgtaylor/huma/v2
              desc: only internal/api may import Huma
        age-deps:
          # age is imported only by internal/keys (ADR-0015 decision 2).
          # depguard file exclusions were not applied for policy-deps, so
          # every package that exists today is listed.
          list-mode: lax
          files: ["**/cmd/**/*.go", "**/internal/agent/**/*.go", "**/internal/api/**/*.go", "**/internal/cli/**/*.go", "**/internal/installtest/**/*.go", "**/internal/policy/**/*.go", "**/internal/protocol/**/*.go", "**/internal/proxy/**/*.go", "**/internal/registry/**/*.go", "**/internal/release/**/*.go", "**/internal/server/**/*.go", "**/internal/store/**/*.go"]
          deny:
            - pkg: filippo.io/age
              desc: only internal/keys may import age (ADR-0015)
        sqlite-deps:
          # modernc sqlite is imported only by internal/store/sqlite and
          # internal/agent/state (ADR-0010, amended 2026-11-17). Every file
          # outside those two directories is covered, so new packages are too.
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/store/sqlite/**"
            - "!**/internal/agent/state/**"
          deny:
            - pkg: modernc.org/sqlite
              desc: only internal/store/sqlite and internal/agent/state may import modernc sqlite (ADR-0010)
        policy-deps:
          # compose-go and go-toml are imported only by internal/policy
          # (ADR-0009). Every file outside internal/policy is covered, so new
          # packages are too.
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/policy/**"
          deny:
            - pkg: github.com/compose-spec/compose-go/v2
              desc: only internal/policy may import compose-go (ADR-0009)
            - pkg: github.com/pelletier/go-toml/v2
              desc: only internal/policy may import go-toml (ADR-0009)
        pgx-deps:
          # pgx is imported only by internal/store/pg (ADR-0010, amended
          # 2026-11-18). Every Go file outside internal/store/pg is covered,
          # tests included, so new packages and test files are too.
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/store/pg/**"
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: only internal/store/pg may import pgx (ADR-0010)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          pkg: ^fmt$
          msg: only cmd/ writes to the terminal
        - pattern: ^log\.Print.*$
          pkg: ^log$
          msg: only cmd/ writes to the terminal
    godox:
      keywords:
        - TODO
        - FIXME
        - XXX
        - HACK
    govet:
      enable-all: true
    nolintlint:
      require-specific: true
      require-explanation: true
  exclusions:
    rules:
      - path: ^cmd/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - gosec
      - path: _test\.go
        linters:
          - govet
        text: "fieldalignment:"
      - path: _test\.go
        linters:
          - govet
        text: "shadow:"
      - path: _test\.go
        linters:
          - errcheck
        text: "rows.Close"
      # Waiting on a done channel of errors in a locked W1-4 test.
      - path: (internal/agent/connect_test|internal/server/agent_test)\.go
        linters:
          - errcheck
        text: "Error return value is not checked"
      # The pipeline tool runs fixed tools (git, gh, go, make, golangci-lint)
      # without a shell and reads files inside its own checkout.
      - path: ^tools/pipeline/
        linters:
          - gosec
        text: "G204|G304|G702|G703"
      - path: ^tools/pipeline/
        linters:
          - govet
        text: "fieldalignment:"
      # gosec does not run on tests, so nolint:gosec in them is "unused".
      - path: _test\.go
        linters:
          - nolintlint
        text: "unused for linter \"gosec\""

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - internal/policy/compose_test.go
      - internal/agent/connect_test.go
      # Locked W2-1 tests that gofumpt would reformat.
      - internal/cli/cli_test.go
      - internal/store/tokens_audit_test.go
  settings:
    goimports:
      local-prefixes:
        - moonglass.dev/moonglass
